---
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  MISE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup mise
        uses: jdx/mise-action@v5
        with:
          minimum_release_age: 0s

      - name: run linters
        run: mise run chk
...

---
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  MISE_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: run linters
        run: mise run chk
